<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小游戏合集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background: #12141c;
    color: #e8e6e0;
    font-family: 'Courier New', 'Microsoft YaHei', monospace;
  }
  header {
    padding: 48px 24px 12px;
    text-align: center;
  }
  header h1 { font-size: 34px; letter-spacing: 4px; }
  header h1 .accent { color: #7ee081; }
  header p { margin-top: 10px; color: #9a978f; font-size: 14px; }
  main {
    max-width: 1060px;
    margin: 28px auto 12px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 22px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #1b1e2a;
    border: 2px solid #2c3040;
    border-radius: 12px;
    overflow: hidden;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: #7ee081;
    box-shadow: 0 8px 24px rgba(126, 224, 129, .15);
  }
  .thumb {
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 58px;
    background: linear-gradient(135deg, #232839 0%, #171a26 100%);
    position: relative;
  }
  .thumb .new-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #e05d5d;
    color: #fff;
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 10px;
    letter-spacing: 2px;
  }
  .card .info { padding: 14px 16px 16px; }
  .card .info h2 { font-size: 18px; margin-bottom: 8px; }
  .card .info p { font-size: 13px; color: #9a978f; line-height: 1.6; min-height: 42px; }
  .card .tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .card .tags span {
    font-size: 12px;
    color: #7ee081;
    background: rgba(126, 224, 129, .1);
    border: 1px solid rgba(126, 224, 129, .3);
    border-radius: 4px;
    padding: 1px 8px;
  }
  .card .play {
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
    color: #12141c;
    background: #7ee081;
    border-radius: 6px;
    padding: 7px 0;
    letter-spacing: 2px;
  }
  .card:hover .play { background: #9df0a0; }
  footer {
    text-align: center;
    padding: 30px 24px 40px;
    color: #6b6962;
    font-size: 12px;
    line-height: 1.8;
  }
  footer code {
    color: #9a978f;
    background: #1b1e2a;
    padding: 1px 6px;
    border-radius: 4px;
  }
  /* 手机上禁用双击缩放（快速连点卡片时避免页面被放大） */
  body { touch-action: manipulation; }
</style>
</head>
<body>
<header>
  <h1>🎮 小游戏<span class="accent">合集</span></h1>
  <p>纯网页小游戏 · 零依赖 · 离线可玩 · 点开即玩</p>
</header>
<main id="grid"></main>
<footer>
  添加新游戏：在 <code>games/</code> 下新建目录放入 <code>index.html</code>，再在 <code>index.html</code> 的 <code>GAMES</code> 列表里加一条即可
</footer>
<script>
(function () {
  'use strict';

  /* 游戏列表：新增游戏时在这里加一条即可 */
  var GAMES = [
    {
      title: '头头药水大作战',
      emoji: '🧪',
      desc: '俯视角弹幕守关：化身一颗方块脑袋，用隐身、全场尖刺和护盾挡住僵尸与骷髅的 5 波攻势。',
      tags: ['2D', '弹幕', '守关'],
      path: 'games/potion-master/index.html'
    },
    {
      title: '废弃城堡大冒险',
      emoji: '🏰',
      desc: '横版动作闯关：古堡与金字塔两张地图各 10 关，带宠物夺王冠，通关解锁法老权杖。',
      tags: ['2D', '闯关', 'Boss'],
      path: 'games/castle/index.html'
    },
    {
      title: '时空小队大冒险',
      emoji: '⏳',
      desc: '小晚操控时间、小猫宝瞬移、百变捏人技能随造型解锁！六大世界 36 关，简单/普通/困难三档难度，9 种怪物 6 场 BOSS 战。',
      tags: ['2D', '动作', '捏人', '36关'],
      path: 'games/hero-squad/index.html',
      isNew: true
    }
  ];

  var grid = document.getElementById('grid');
  GAMES.forEach(function (g) {
    var a = document.createElement('a');
    a.className = 'card';
    a.href = g.path;
    a.target = '_blank';
    a.rel = 'noopener';

    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.textContent = g.emoji;
    if (g.isNew) {
      var badge = document.createElement('span');
      badge.className = 'new-badge';
      badge.textContent = 'NEW';
      thumb.appendChild(badge);
    }

    var info = document.createElement('div');
    info.className = 'info';
    var h2 = document.createElement('h2');
    h2.textContent = g.title;
    var p = document.createElement('p');
    p.textContent = g.desc;
    var tags = document.createElement('div');
    tags.className = 'tags';
    (g.tags || []).forEach(function (t) {
      var s = document.createElement('span');
      s.textContent = t;
      tags.appendChild(s);
    });
    var play = document.createElement('div');
    play.className = 'play';
    play.textContent = '▶ 开始游戏';
    info.appendChild(h2);
    info.appendChild(p);
    info.appendChild(tags);
    info.appendChild(play);

    a.appendChild(thumb);
    a.appendChild(info);
    grid.appendChild(a);
  });

  /* 兜底拦截双击缩放：320ms 内的第二次 touchend 阻止默认（Safari 双击放大） */
  var lastTap = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTap < 320 && e.touches.length === 0) e.preventDefault();
    lastTap = now;
  }, { passive: false });
})();
</script>
</body>
</html>
