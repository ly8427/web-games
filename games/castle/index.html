<style>
  /* 独立运行外壳：游戏本体原为可嵌入片段，此处补页面基础样式与片段未自带的按钮样式 */
  html, body { margin: 0; padding: 0; background: #06080f; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 12px;
    box-sizing: border-box;
  }
  #castle-game { width: 100%; max-width: 980px; }
  /* 触屏设备：body 加 touchOn 类（由文件尾脚本设置）。
     竖屏时游戏画面（16:9）天然只是一条横带——此处去掉页面留白让画面铺满屏宽，
     并显示「建议横屏」提示条；桌面无 touchOn 类，不受影响 */
  body.touchOn { padding: 6px 4px; }
  @media (orientation: portrait) {
    body.touchOn { padding: 0; padding-top: 9vh; align-items: flex-start; }
    body.touchOn #castle-game { max-width: none; }
    body.touchOn #castle-game .cg-wrap { max-width: none; border-radius: 0; }
    /* 核心修复：竖屏窄幕下菜单列实际高达 ~2200px，原先被困在画布高度的
       小窗口里滚动（几乎不可用）。改为菜单浮层占满整个视口、独立滚动 */
    body.touchOn #cg-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 18px 14px 44px;
      align-items: flex-start;
      background: rgba(7, 8, 16, .92);
    }
    body.touchOn #cg-overlay .cg-inner { max-width: 470px; }
    /* 菜单列在窄屏高达 ~2200px，开始按钮垫底；竖屏下让它悬浮在屏幕底部常驻 */
    body.touchOn #cg-overlay #cg-start {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 14px;
      z-index: 21;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .5);
    }
  }
  #rotateHint {
    display: none;
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: 14px;
    z-index: 50;
    background: rgba(20, 24, 38, .92);
    color: #ffd97a;
    border: 1px solid rgba(255, 217, 122, .45);
    border-radius: 22px;
    padding: 9px 18px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  @media (orientation: portrait) {
    body.touchOn #rotateHint { display: block; }
  }
  #castle-game .btn {
    font-family: inherit;
    font-size: 16px;
    line-height: 1.4;
    color: #ece6d8;
    background: #1a2030;
    border: 1px solid rgba(236, 230, 216, .25);
    border-radius: 10px;
    padding: 10px 22px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
  }
  #castle-game .btn:hover { border-color: rgba(236, 230, 216, .6); transform: translateY(-1px); }
  #castle-game .btn-primary {
    background: #b3801f;
    border-color: #d4a94e;
    color: #14100a;
    font-weight: 700;
    letter-spacing: 2px;
  }
  #castle-game .btn-primary:hover { background: #d4a94e; }
  #castle-game .btn-ghost { background: transparent; }
  #castle-game .viz-tile {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-width: 150px;
    padding: 12px 18px;
  }
  #castle-game .viz-tile[aria-pressed="true"] {
    border-color: #d4a94e;
    box-shadow: 0 0 0 1px #d4a94e inset;
  }
</style>

function makeEnemyObj(type,x,y){
  const sizes={zombie:{w:22,h:38},skeleton:{w:22,h:38},boss:{w:30,h:54},mummy:{w:22,h:40},petmummy:{w:22,h:40},scarab:{w:24,h:20},vulture:{w:26,h:18},scorpion:{w:22,h:34},ghost:{w:22,h:34},pharaoh:{w:30,h:56}};
  const s=sizes[type]||{w:22,h:38};
  const boss=type==="boss"||type==="pharaoh";
  const baseHp=type==="pharaoh"?100:10;
  const hp=Math.round(baseHp*(boss?diff.bossMul:1));
  return {type:type,x:x,y:y,w:s.w,h:s.h,dir:1,vx:0,vy:0,hp:hp,maxHp:hp,friendly:type==="petmummy"?true:false,lifeT:type==="petmummy"?0:0,anim:Math.random()*6,atkT:0,atkAnim:0,shootT:(type==="skeleton"||type==="scorpion"||type==="pharaoh")?1.5+Math.random():0,telegraph:0,firing:false,throwCd:boss?2+Math.random():0,visT:0,drinkT:0,drinkCd:boss?7+Math.random()*2:0,summonCd:type==="pharaoh"?4:0,phase2:false,flash:0,dead:false,deathT:0,seed:Math.random()*100};
}

function buildLevel(cfg){
  level=cfg;solids=[];
  const tiles=cfg.w/TILE;
  for(let tx=0;tx<tiles;tx++){const inPit=cfg.pits.some(function(p){return tx>=p[0]&&tx<p[0]+p[1];});if(!inPit)solids.push({x:tx*TILE,y:GROUND_Y,w:TILE,h:140});}
  for(const p of cfg.plats)solids.push({x:p.x,y:p.y,w:p.w,h:26});
  chests=cfg.chests.map(function(c){return {item:c.item,x:c.x,y:c.y,opened:false,seed:Math.random()*100};});
  enemies=cfg.enemies.map(function(c){return makeEnemyObj(c.type,c.x,c.y);});
  if(diff.extra>0){
    const pool=selectedMap==="pyramid"?["mummy","scarab","scorpion","vulture"]:["zombie","skeleton"];
    if(diff.extra>=4)pool.push("ghost");
    if(diff.extra>=6)pool.push("mummy","scarab");
    let added=0,guard=0;
    while(added<diff.extra&&guard<300){
      guard++;
      const tx=3+Math.floor(Math.random()*(tiles-8));
      if(cfg.pits.some(function(p){return tx>=p[0]&&tx<p[0]+p[1];}))continue;
      const type=pool[Math.floor(Math.random()*pool.length)];
      const y=type==="vulture"?GROUND_Y-150:(type==="ghost"?GROUND_Y-90:GROUND_Y-40);
      enemies.push(makeEnemyObj(type,tx*TILE+16,y));
      added++;
    }
  }
  treasure=null;
  torches=[];for(let tx=8;tx<tiles-4;tx+=16){if(!cfg.pits.some(function(p){return tx>=p[0]&&tx<p[0]+p[1];}))torches.push({x:tx*TILE+16,y:GROUND_Y-8,seed:Math.random()*10});}
  chains=[];for(let tx=10;tx<tiles-6;tx+=24)chains.push({x:tx*TILE+12,seed:Math.random()*10});
}

function makeStatPhoto(title,stats){
  try{
    const c=document.createElement("canvas");
    c.width=W;c.height=H;
    const g=c.getContext("2d");
    g.drawImage(canvas,0,0,W,H);
    g.fillStyle="rgba(8,10,18,0.84)";
    g.fillRect(0,H-152,W,152);
    g.fillStyle="rgba(242,201,76,0.9)";
    g.fillRect(0,H-152,W,3);
    g.textAlign="center";
    g.fillStyle="#f2c94c";g.font="bold 26px sans-serif";
    g.fillText(title,W/2,H-118);
    g.fillStyle="#e8e2d0";g.font="15px sans-serif";
    for(let i=0;i<stats.length;i++){
      const col=i%3,row=Math.floor(i/3);
      g.fillText(stats[i],W*(col*2+1)/6,H-86+row*24);
    }
    return c.toDataURL("image/png");
  }catch(e){return null;}
}
function savePhoto(url,name){
  if(!url)return;
  try{
    const a=document.createElement("a");
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  }catch(e){}
  try{window.open(url,"_blank");}catch(e){}
}

function moveBody(e,dt){
  e.onGround=false;
  e.x+=e.vx*dt;
  for(const s of solids){if(overlap(e,s)){if(e.vx>0)e.x=s.x-e.w;else if(e.vx<0)e.x=s.x+s.w;e.vx=0;}}
  e.y+=e.vy*dt;
  for(const s of solids){if(overlap(e,s)){if(e.vy>0){e.y=s.y-e.h;e.vy=0;e.onGround=true;}else if(e.vy<0){e.y=s.y+s.h;e.vy=0;}}}
}
function edgeAhead(e,dir){const x=e.x+dir*(e.w/2+10),y=e.y+e.h/2+2;for(const s of solids){if(x>s.x&&x<s.x+s.w&&y>s.y&&y<s.y+s.h)return true;}return false;}
function lineBlocked(x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0),steps=Math.max(1,Math.floor(d/12));for(let i=0;i<=steps;i++){const t=i/steps,x=lerp(x0,x1,t),y=lerp(y0,y1,t);for(const s of solids){if(x>s.x&&x<s.x+s.w&&y>s.y&&y<s.y+s.h)return true;}}return false;}

function fireBow(aimSrc){

    const dx=mouse.x-p.x,dy=mouse.y-(p.y-24);
    if(Math.abs(dy)<42||Math.abs(dx)<70){
      rel=0;
    }else{
      let diff=Math.atan2(dy,dx)-(p.facing===1?0:Math.PI);
      while(diff>Math.PI)diff-=Math.PI*2;
      while(diff<-Math.PI)diff+=Math.PI*2;
      if(Math.abs(diff)<0.14)diff=0;
      rel=clamp(diff,-0.9,0.9);
    }
  }else{
    if(keys.ArrowUp)rel+=(p.facing===1?-0.45:0.45);
    if(keys.ArrowDown)rel+=(p.facing===1?0.45:-0.45);
    rel=clamp(rel,-0.9,0.9);
  }
  const base=(p.facing===1?0:Math.PI)+rel;
  for(let k=-1;k<=1;k++){
    const a=base+k*0.22;
    arrows.push({x:p.x+p.facing*20,y:p.y-24,vx:Math.cos(a)*560,vy:Math.sin(a)*560,dmg:10,from:"player",life:1.1,seed:Math.random()*10});

function updateBoss(e,dt){

function updateEnemies(dt){
  const edt=dt*diff.speedMul;
  for(const e of enemies){
    if(e.dead){e.deathT-=dt;continue;}
    e.flash=Math.max(0,e.flash-dt);e.anim+=dt*10;
    if(e.scaredT>0){
      e.scaredT-=edt;
      if(e.type==="vulture"){
        const away=player.x<e.x?1:-1;
        e.x+=away*80*edt;e.y-=40*edt;
      }else{
        const away=player.x<e.x?1:-1;
        if(edgeAhead(e,away))e.vx=away*(e.type==="scarab"?95:50);else e.vx=0;
        moveBody(e,edt);
      }
      continue;
    }
    if(e.type==="petmummy")updatePetMummy(e,dt);
    else if(e.type==="ghost")updateGhost(e,edt);
    else if(e.type==="zombie")updateZombie(e,edt);
    else if(e.type==="mummy")updateMummy(e,edt);
    else if(e.type==="scarab")updateScarab(e,edt);
    else if(e.type==="vulture")updateVulture(e,edt);
    else if(e.type==="scorpion")updateScorpion(e,edt);
    else if(e.type==="pharaoh")updatePharaoh(e,edt);
    else if(e.type==="skeleton")updateSkeleton(e,edt);
    else updateBoss(e,edt);
    if(e.y>H+150)e.dead=true;
  }
  enemies=enemies.filter(function(e){return !(e.dead&&e.deathT<=0);});

function updateArrows(dt){

    let gone=a.life<=0||a.x<camX-60||a.x>camX+W+60||a.y>H+80;
    if(!gone&&a.from==="player"){
      for(const e of enemies){if(e.dead||e.friendly)continue;if(Math.abs(a.x-e.x)<e.w/2+8&&Math.abs(a.y-(e.y-e.h/2))<e.h/2+8){hitEnemy(e,a.dmg);gone=true;break;}}

}

window.addEventListener("keydown",function(e){
  const c=e.code;
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].indexOf(c)>=0)e.preventDefault();
  ensureAudio();
  keys[c]=true;
  if(state==="playing"){
    if(c==="KeyJ")attackStart("key");
    if(c==="KeyK")throwBomb();
    if(c==="KeyQ")switchWeapon();
    if(c==="KeyL")summonMummy();
    if(c==="KeyO")togglePet();
    if(c==="Space"||c==="ArrowUp")player.jumpQueued=true;
  }
  if(state==="levelclear"&&(c==="Enter"||c==="NumpadEnter"))nextLevel();
  if(c==="KeyM"){muted=!muted;if(master)master.gain.value=muted?0:0.45;}
  if(c==="Escape"||c==="KeyP"){
    if(state==="playing"){state="paused";showPause();}
    else if(state==="paused"){hideOverlay();state="playing";}
  }
});
window.addEventListener("keyup",function(e){
  keys[e.code]=false;
  if(e.code==="KeyJ")attackEnd();
});
canvas.addEventListener("mousemove",function(e){
  const r=canvas.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*(W/r.width);mouse.y=(e.clientY-r.top)*(H/r.height);
  mouse.t=performance.now();mouse.aiming=true;
});
canvas.addEventListener("mousedown",function(e){
  ensureAudio();
  try{canvas.focus();}catch(err){}
  if(e.button===2)return;
  mouse.held=true;
  if(state==="playing"&&e.button===0)attackStart("mouse");
});
canvas.addEventListener("contextmenu",function(e){
  e.preventDefault();
  if(state==="playing"&&player&&!player.dead){
    const c=nearChest();
    if(c)openChest(c);
  }
});
window.addEventListener("mouseup",function(){mouse.held=false;attackEnd();});
window.addEventListener("blur",function(){for(const k in keys)keys[k]=false;mouse.held=false;});
touchEl.querySelectorAll(".cg-tbtn").forEach(function(btn){
  const code=btn.getAttribute("data-code"),action=btn.getAttribute("data-action");
  const down=function(e){e.preventDefault();ensureAudio();if(code)keys[code]=true;if(action==="attack"){mouse.held=true;attackStart("touch");}if(action==="bomb")throwBomb();if(action==="chest"){const c=nearChest();if(c)openChest(c);}if(action==="pet")togglePet();};
  const up=function(e){e.preventDefault();if(code)keys[code]=false;if(action==="attack"){mouse.held=false;attackEnd();}};
  btn.addEventListener("pointerdown",down);btn.addEventListener("pointerup",up);btn.addEventListener("pointercancel",up);btn.addEventListener("pointerleave",up);
});
if("ontouchstart" in window||navigator.maxTouchPoints>0)touchEl.classList.add("show");

showMenu();
requestAnimationFrame(frame);
root.__cgDebug={startRun:startRun,startLevel:startLevel,fireBow:fireBow,throwBomb:throwBomb,doSlash:doSlash,scepterStrike:scepterStrike,summonMummy:summonMummy,hitEnemy:hitEnemy,damagePlayer:damagePlayer,step:update,advance:nextLevel,openChestHere:function(){const c=nearChest();if(c){openChest(c);return true;}return false;},selectPet:function(p){selectedPet=p;},selectSkin:function(s){selectedSkin=s;},selectDiff:function(d){selectedDiff=d;},aimMouse:function(x,y){mouse.x=x;mouse.y=y;mouse.t=performance.now();mouse.aiming=true;},expireMouse:function(){mouse.t=performance.now()-5000;},getArrows:function(){return arrows;},getTorches:function(){return torches;},getDiff:function(){return diff;},getDifficulty:function(){return selectedDiff;},getNearChest:nearChest,getState:function(){return state;},getPlayer:function(){return player;},getEnemies:function(){return enemies;},getLevel:function(){return level;},getChests:function(){return chests;},getCarry:function(){return carry;},getLevelNum:function(){return levelNum;},getMap:function(){return selectedMap;},getPet:function(){return pet;},getSelectedPet:function(){return selectedPet;},getSelectedSkin:function(){return selectedSkin;},getTreasure:function(){return treasure;},getScepterUnlocked:function(){return scepterUnlocked;},getIntroT:function(){return introT;},getClearT:function(){return clearT;},keys:keys};
})();
</script>
</div>

<div id="rotateHint">↻ 建议横屏握持，画面大一倍多 · 点击关闭</div>
<script>
(function () {
  function enable() { document.body.classList.add('touchOn'); }
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) enable();
  document.addEventListener('touchstart', enable, { once: true, capture: true, passive: true });
  var hint = document.getElementById('rotateHint');
  hint.addEventListener('click', function () { hint.style.display = 'none'; });
})();
</script>
